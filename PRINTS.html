<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Â· Carona Campus</title>
<link rel="stylesheet" href="prints.css">
<style>body{background:#fff;padding:16px 12px 32px}.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}.bloco h2{display:none}.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}.tb{background:#0d9488}.btn.main{background:#0d9488}</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Carona Campus</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Centro -> IF 07:20</strong><div class="muted">2 vagas</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Bairro Norte -> IF</strong><div class="muted">1 vaga</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>IF -> Terminal 12:10</strong><div class="muted">0 vagas</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Shopping -> IF</strong><div class="muted">3 vagas</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>IF -> Centro 17:40</strong><div class="muted">2 vagas</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Carona Campus</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item"><div><strong>IF -> Terminal 12:10</strong><div><span class="badge bad">lotado</span></div></div><button class="btn ghost" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">—</button></div><div class="item"><div><strong>Centro -> IF 07:20</strong><div class="muted">1 vaga</div></div><button class="btn main" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">Pegar</button></div><div class="aviso info">Vaga reservada — restante: 1</div><button class="btn main">Minhas caronas</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
